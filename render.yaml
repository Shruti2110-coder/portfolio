# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard → New → Blueprint → pick this repo
services:
  # ---------- Express API ----------
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard — never commit this.
      # MongoDB Atlas connection string, database name `portfolio`.
      - key: MONGODB_URI
        sync: false
      # Your deployed client URL, e.g. https://portfolio-web.onrender.com
      - key: CLIENT_ORIGIN
        sync: false

  # ---------- React client ----------
  - type: web
    name: portfolio-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: portfolio-api
          property: host
    routes:
      # Single-page app: every path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
