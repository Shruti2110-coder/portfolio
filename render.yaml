# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard → New → Blueprint → pick this repo
services:
  # ---------- Express API ----------
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard — never commit this.
      # MongoDB Atlas connection string, database name `portfolio`.
      - key: MONGODB_URI
        sync: false
      # Your deployed client URL, e.g. https://portfolio-web.onrender.com
      - key: CLIENT_ORIGIN
        sync: false

  # ---------- React client ----------
  - type: web
    name: portfolio-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    # No VITE_API_URL needed. The client calls a same-origin /api path and the
    # rewrite below proxies it to the API, so there is no build-time URL to get
    # wrong and no cross-origin request to configure.
    #
    # Do NOT reintroduce `fromService: property: host` — for a web service that
    # resolves to the internal private-network name, which a browser cannot reach.
    routes:
      # Proxy API calls to the backend. Must come before the SPA catch-all.
      - type: rewrite
        source: /api/*
        destination: https://portfolio-api-qkmt.onrender.com/api/*
      # Single-page app: every other path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
