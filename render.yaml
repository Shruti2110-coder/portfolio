# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard → New → Blueprint → pick this repo
services:
  # ---------- Express API ----------
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard — never commit this.
      # MongoDB Atlas connection string, database name `portfolio`.
      - key: MONGODB_URI
        sync: false
      # Your deployed client URL, e.g. https://portfolio-web.onrender.com
      - key: CLIENT_ORIGIN
        sync: false

  # ---------- React client ----------
  - type: web
    name: portfolio-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set this by hand in the Render dashboard to the API's PUBLIC url,
      # e.g. https://portfolio-api-xxxx.onrender.com
      #
      # Do NOT use `fromService: property: host` here — for a web service that
      # resolves to the internal private-network name (just "portfolio-api-xxxx"),
      # which the browser cannot reach. Vite bakes this in at build time, so
      # after changing it you must trigger a redeploy of this service.
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
